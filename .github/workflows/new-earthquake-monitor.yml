name: Global new earthquake cloud monitor
on:
  schedule:
    # Explicit hourly slots; both run entirely on GitHub-hosted runners.
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-new-earthquake-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/monitor
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch authoritative catalog and persist queue
        run: node .github/monitor/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
